<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YouTube Player</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app">
        <!-- Заголовок -->
        <header class="header">
            <h1>🎬 YouTube Player</h1>
            <p class="subtitle">Смотрите YouTube без ограничений</p>
        </header>

        <!-- Поиск -->
        <div class="search-container">
            <input
                type="text"
                id="searchInput"
                placeholder="Поиск видео или вставьте ссылку..."
                autocomplete="off"
            >
            <button id="searchBtn" class="btn btn-primary">
                🔍 Поиск
            </button>
        </div>

        <!-- Видео плеер -->
        <div id="playerContainer" class="player-container hidden">
            <div class="video-wrapper">
                <iframe
                    id="videoPlayer"
                    frameborder="0"
                    allowfullscreen
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                ></iframe>
            </div>
            <div class="video-info">
                <h2 id="videoTitle"></h2>
                <p id="videoAuthor"></p>
                <div class="video-stats">
                    <span id="videoViews"></span>
                    <span id="videoDuration"></span>
                </div>
            </div>
            <button id="closePlayerBtn" class="btn btn-secondary">
                ✖️ Закрыть плеер
            </button>
        </div>

        <!-- Результаты поиска -->
        <div id="searchResults" class="search-results"></div>

        <!-- Загрузка -->
        <div id="loader" class="loader hidden">
            <div class="spinner"></div>
            <p>Загрузка...</p>
        </div>

        <!-- Сообщения об ошибках -->
        <div id="errorMessage" class="error-message hidden"></div>

        <!-- Популярные видео (можно добавить) -->
        <div id="trending" class="trending-section">
            <h3>📺 Популярное</h3>
            <div id="trendingVideos" class="video-grid"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
